# soso-kit 项目注册表
#
# 格式：每行一个项目名（= git 主仓 basename）
# 作用：rules 分发、context 存储、未来的 /k:figma / /k:ui overrides 共用此表
#
# 新增方式：
#   a) 全量脚手架：sosokit-add <project-name>
#   b) context-only：在项目里跑 context-init 会自动注册
#
# 识别规则（identify.sh::identify_project）：
#   1. 主识别：git worktree list | head -1 | basename → 查表
#      覆盖所有 worktree 场景（worktree 叫什么都无关紧要）
#   2. Fallback：当前 cwd basename 以某已注册项目名开头 → 归属该项目
#      覆盖独立 clone + 命名规范场景（如 sodex-web-backup → sodex-web）
#   3. 都未命中 → 报错，可用 --module <name> 显式指定

sodex-web
sodex-next
sodex-biz
sodex-admin-dashboard
sodex-lens
exp-ads
sosovalue-mobile
